<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyderabad Food Trail</title>
    <meta name="description" content="A scroll-driven food journey through Hyderabad.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-day">
    <!-- Sticky Progress Nav -->
    <nav id="progress-nav" aria-hidden="true">
        <div id="progress-bar"></div>
    </nav>

    <!-- Theme Toggle -->
    <button id="theme-toggle" aria-label="Toggle Theme" class="btn-icon">
        <svg id="icon-sun" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg id="icon-moon" class="icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>

    <!-- HERO SECTION -->
    <section id="hero">
        <div class="hero-content">
            <h1 id="hero-title" aria-label="Taste of Hyderabad"></h1>
            <p class="tagline">From dawn at Charminar to late-night Irani cafes, discover the soul of the City of Pearls.</p>
            <button id="start-btn" class="btn-primary" aria-label="Start the food trail">Start the Trail <span class="pulse-icon">↓</span></button>
        </div>
        <div class="hero-bg" aria-hidden="true">
            <svg class="charminar-silhouette" viewBox="0 0 800 400" preserveAspectRatio="xMidYMax meet">
                <path d="M100 400 L100 150 L120 150 L120 100 L110 100 L110 50 L130 50 L130 100 L120 100 L120 150 L160 150 L160 400 Z" fill="currentColor"/>
                <path d="M640 400 L640 150 L680 150 L680 100 L670 100 L670 50 L690 50 L690 100 L680 100 L680 150 L700 150 L700 400 Z" fill="currentColor"/>
                <path d="M160 400 L160 250 A 240 200 0 0 1 640 250 L640 400 Z" fill="none" stroke="currentColor" stroke-width="20"/>
                <rect x="250" y="180" width="300" height="40" fill="currentColor"/>
                <path d="M300 180 L300 120 A 50 50 0 0 1 400 120 L400 180 Z" fill="currentColor"/>
                <path d="M400 180 L400 120 A 50 50 0 0 1 500 120 L500 180 Z" fill="currentColor"/>
            </svg>
            <div class="steam-container">
                <div class="steam"></div>
                <div class="steam steam-2"></div>
                <div class="steam steam-3"></div>
            </div>
        </div>
    </section>

    <!-- FILTER BAR -->
    <div id="filter-container">
        <div class="filter-bar type-filter" role="group" aria-label="Filter food stops">
            <button class="filter-btn active" data-filter="All">All Types</button>
            <button class="filter-btn" data-filter="Main Course">Main Course</button>
            <button class="filter-btn" data-filter="Snacks">Snacks</button>
            <button class="filter-btn" data-filter="Sweets">Sweets</button>
        </div>
        <div class="filter-bar diet-filter" role="group" aria-label="Filter diet">
            <button class="diet-btn filter-btn active" data-diet="All">All Diets</button>
            <button class="diet-btn filter-btn" data-diet="veg">Veg 🌱</button>
            <button class="diet-btn filter-btn" data-diet="non-veg">Non-Veg 🍗</button>
        </div>
    </div>

    <!-- THE TRAIL -->
    <section id="trail">
        <svg class="trail-line-svg" preserveAspectRatio="none" aria-hidden="true">
            <path id="trail-path" d="" fill="none" stroke="var(--color-saffron)" stroke-width="4" stroke-dasharray="15, 15"/>
        </svg>
        <div id="no-results" class="hidden">
            <div class="large-emoji">🕵️</div>
            <p>No dishes found for this category!</p>
        </div>
        <div id="stops-container">
            <!-- Stops injected by JS -->
        </div>
    </section>

    <!-- EXTRAS SECTION -->
    <section id="extras">
        <!-- QUIZ -->
        <div class="quiz-section" id="quiz-container">
            <h2>Which Hyderabadi Dish Are You?</h2>
            <div id="quiz-intro">
                <p>Take this short personality quiz to find your culinary match.</p>
                <button id="start-quiz-btn" class="btn-primary">Start Quiz</button>
            </div>
            <div id="quiz-question-container" class="hidden">
                <div class="quiz-progress-bar"><div id="quiz-progress"></div></div>
                <h3 id="question-text"></h3>
                <div id="options-container"></div>
            </div>
            <div id="quiz-result" class="hidden">
                <h3>Your Match: <span id="result-dish-name"></span></h3>
                <div id="result-emoji" class="large-emoji"></div>
                <p id="result-desc"></p>
                <p>Match: <span id="result-match"></span>%</p>
                <div class="quiz-actions">
                    <button id="retake-quiz-btn" class="btn-secondary">Retake Quiz</button>
                    <button id="share-quiz-btn" class="btn-primary">Share Result</button>
                </div>
            </div>
        </div>

        <!-- FOOD FACT -->
        <div class="fact-section">
            <button id="fact-btn" class="btn-secondary">Food Fact of the Day 💡</button>
            <div id="fact-display" class="fact-card hidden" aria-live="polite"></div>
            <canvas id="confetti-canvas"></canvas>
        </div>
    </section>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
